  const words=[];parts.forEach((p,i)=>p.split(' ').forEach((wd,k)=>{if(!wd)return;if(k===0&&/^[,.…]/.test(wd)&&words.length&&!p.startsWith(' ')){words.push([wd,i%2===1,true])}else words.push([wd,i%2===1])}));const lines=[[]];let lw=0;words.forEach(([wd,h,glue])=>{const ww=x.measureText(wd+' ').width;if(glue&&lines[lines.length-1].length){const L=lines[lines.length-1],last=L[L.length-1];last[2]-=x.measureText(' ').width;}if(lw+ww>900){lines.push([]);lw=0}lines[lines.length-1].push([wd,h,ww]);lw+=ww});
  const Y0=1700-(lines.length-1)*30,bh=lines.length*62+40;x.fillStyle='#fffaf0';x.fillRect(60,Y0-58,960,bh);x.lineWidth=7;x.strokeStyle=INK;x.strokeRect(60,Y0-58,960,bh);
  lines.forEach((ln,i)=>{const tot=ln.reduce((s,w)=>s+w[2],0);let xx=W/2-tot/2;ln.forEach(([wd,h,ww])=>{x.fillStyle=h?RED:INK;x.textAlign='left';x.fillText(wd,xx,Y0+i*62);xx+=ww})});x.restore()}

function rngS(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let q=Math.imul(s^s>>>15,1|s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296}}

window.renderAt=renderAt;window.assetsReady=ready.then(()=>document.fonts.ready);
let playing=false,t0=0,tcur=0;const pp=document.getElementById('pp'),sc=document.getElementById('sc'),tt=document.getElementById('tt');
function frame(now){if(!playing)return;tcur=(now-t0)/1000;if(tcur>=DUR){tcur=0;t0=now}sc.value=tcur;tt.textContent=tcur.toFixed(1)+' s';renderAt(tcur);requestAnimationFrame(frame)}
pp.onclick=()=>{if(playing){playing=false;pp.textContent='▶ Lecture';return}playing=true;pp.textContent='❚❚ Pause';t0=performance.now()-tcur*1000;requestAnimationFrame(frame)};
sc.oninput=()=>{tcur=+sc.value;tt.textContent=tcur.toFixed(1)+' s';if(playing)t0=performance.now()-tcur*1000;renderAt(tcur)};
