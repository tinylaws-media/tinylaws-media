<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minato vs Itachi · animation v2</title>
<style>
html,body{margin:0;background:#07080b;color:#f2f2ee;font-family:'Inter',system-ui,sans-serif}
canvas{display:block;width:100%;max-width:1080px;margin:0 auto;aspect-ratio:1080/960}
#ui{max-width:1080px;margin:10px auto;display:flex;gap:12px;align-items:center;padding:0 16px;box-sizing:border-box}
#ui button{font:600 15px inherit;background:#1d2029;color:#f2f2ee;border:1px solid #333743;border-radius:8px;padding:8px 14px;cursor:pointer}
#ui input{flex:1;accent-color:#F5C542}
#tt{font:13px ui-monospace,monospace;color:#a9abb3;min-width:64px;text-align:right}
body.film #ui{display:none}
</style></head><body>
<canvas id="c" width="1080" height="960"></canvas>
<div id="ui"><button id="pp">▶ Lecture</button><input type="range" id="sc" min="0" max="60" step="0.01" value="0"><span id="tt">0.0 s</span></div>
<script id="data" type="application/json">__DATA__</script>
<script>
// renderAt(t) dessine l'image exacte à t secondes : lecture dans le navigateur ou rendu vidéo image par image.
const D=JSON.parse(document.getElementById('data').textContent);
const W=1080,H=960,K=1.6,C1=0.352,DUR=60;
const GOLD='#F5C542',RED='#E5384F',GREY='#8A8D96',STEEL='#7FA7D9',INK='#F2F2EE',INK2='#A9ABB3',AMBER='#FF9F43',CYAN='#5BE0D0',BG='#07080b';
const F="'Inter Display','Inter',system-ui,sans-serif";
const cv=document.getElementById('c'),x=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const win=(t,a,b,fi=.35,fo=.35)=>Math.min(seg(t,a,a+fi),1-seg(t,b-fo,b));
const hh=s=>{let h=7;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return((h>>>0)%997)/997};
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// --- probabilités : même calcul que le modèle
function odds(a,sa,b,sb){const mu=(a-b)*K,s=Math.hypot(sa,sb)*K;let pa=0,pb=0,ws=0;
  for(let i=0;i<=600;i++){const z=-9+18*i/600,w=Math.exp(-.5*((z-mu)/s)**2);ws+=w;pa+=w*(1-1/(1+Math.exp(-(C1-z))));pb+=w/(1+Math.exp(C1+z))}
  return [pa/ws,1-(pa+pb)/ws,pb/ws]}
// croyance du modèle à chaque étape : départ = titres officiels, arrivée = modèle ajusté
const KF=[[0,6.0,.5,5.5,.6],[12.6,6.0,.5,5.5,.6],[13.8,6.05,.47,5.5,.6],[19.6,6.05,.47,5.5,.6],[21,6.05,.47,5.85,.45],[24.8,6.05,.47,5.85,.45],[26.8,5.7,.6,5.75,.42],[34.4,5.7,.6,5.75,.42],[36.6,5.84,.635,5.671,.378]];
function belief(t){let i=0;while(i<KF.length-1&&t>KF[i+1][0])i++;const a=KF[i],b=KF[Math.min(i+1,KF.length-1)];
  if(a===b||t<=a[0])return a.slice(1);const u=eio((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],u))}
const FIN=odds(5.84,.635,5.671,.378);

// --- dessin
function T(s,px,py,size,{w=800,c=INK,al='center',a=1,ls=0,bl='alphabetic',glow=0}={}){if(a<=0)return;x.save();x.globalAlpha*=a;x.font=`${w} ${size}px ${F}`;x.fillStyle=c;x.textAlign=al;x.textBaseline=bl;x.letterSpacing=ls+'px';if(glow){x.shadowColor=c;x.shadowBlur=glow}x.fillText(s,px,py);x.restore()}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}
const IMG={};const qs=new URLSearchParams(location.search);
['minato','itachi','obito','kakashi','a4','killer_b'].forEach(id=>{const im=new Image();im.onload=()=>{IMG[id]=im;if(!playing)renderAt(tcur)};im.src=`img/${id}.png`});
function node(px,py,r,col,name,ini,id,a=1,glow=0){if(a<=0||r<=0)return;x.save();x.globalAlpha*=a;
  if(glow>0){x.shadowColor=col;x.shadowBlur=70*glow}
  const g=x.createRadialGradient(px,py-r*.4,r*.1,px,py,r);g.addColorStop(0,'#2a2d38');g.addColorStop(1,'#12141a');
  x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=g;x.fill();x.shadowBlur=0;
  const img=IMG[id];if(img){x.save();x.beginPath();x.arc(px,py,r,0,7);x.clip();const s=Math.max(2*r/img.naturalWidth,2*r/img.naturalHeight);x.drawImage(img,px-img.naturalWidth*s/2,py-img.naturalHeight*s/2,img.naturalWidth*s,img.naturalHeight*s);x.restore()}
  else T(ini,px,py+r*.04,r*.8,{c:col,bl:'middle',w:900});
  x.lineWidth=Math.max(3,r*.075);x.strokeStyle=col;x.beginPath();x.arc(px,py,r,0,7);x.stroke();
  if(name)T(name.toUpperCase(),px,py+r+32,Math.max(19,r*.34),{c:INK,ls:2});x.restore()}
function arrow(x1,y1,x2,y2,p,col,lw,{dash=false,head=true,a=1,flow=-1}={}){if(p<=0||a<=0)return;const ex=lerp(x1,x2,p),ey=lerp(y1,y2,p);x.save();x.globalAlpha*=a;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=lw;x.lineCap='round';
  if(dash)x.setLineDash([lw*1.6,lw*2.2]);x.beginPath();x.moveTo(x1,y1);x.lineTo(ex,ey);x.stroke();x.setLineDash([]);
  if(head&&p>.15){const an=Math.atan2(y2-y1,x2-x1),hs=lw*3.2+6;x.beginPath();x.moveTo(ex,ey);x.lineTo(ex-hs*Math.cos(an-.45),ey-hs*Math.sin(an-.45));x.lineTo(ex-hs*Math.cos(an+.45),ey-hs*Math.sin(an+.45));x.closePath();x.fill()}
  if(flow>=0&&p>=1){for(let k=0;k<3;k++){const u=((flow*.9+k/3)%1);x.beginPath();x.arc(lerp(x1,x2,u),lerp(y1,y2,u),lw*.9,0,7);x.globalAlpha=a*(1-Math.abs(u-.5)*1.6);x.shadowColor=col;x.shadowBlur=14;x.fill()}}
  x.restore()}
function card(cx,cy,w,kick,title,col,a){if(a<=0)return;x.save();x.globalAlpha*=a;const yy=cy+(1-a)*20;
  rr(cx-w/2,yy,w,98,16);x.fillStyle='rgba(18,20,27,.94)';x.fill();x.lineWidth=2;x.strokeStyle=col;x.stroke();
  T(kick,cx,yy+33,16,{c:col,ls:2.5,w:800});T(title,cx,yy+74,26,{w:800});x.restore()}

// --- constellation : tous les combats codés de Naruto (force ↑, histoire →)
const CX0=70,CX1=1010,CY0=236,CY1=790,mlo=-1,mhi=9;
const NP=D.N.map(([a,m,c])=>({x:CX0+(a+.12+.76*hh(c))/D.narcs*(CX1-CX0),y:CY1-(m-mlo)/(mhi-mlo)*(CY1-CY0),c,a}));
const ERANK=new Array(D.E.length);D.order.forEach((ei,r)=>ERANK[ei]=r);
function constellation(t,alpha,draw,hiEdges){if(alpha<=0)return;x.save();x.globalAlpha=alpha;
  const nE=D.E.length,shown=Math.floor(draw*nE);x.globalCompositeOperation='lighter';
  if(draw<1&&t>4.3){const e=D.E[D.order[Math.max(0,shown-1)]];const sxp=Math.max(NP[e[0]].x,NP[e[1]].x);const lg=x.createLinearGradient(sxp-120,0,sxp+4,0);lg.addColorStop(0,'rgba(91,224,208,0)');lg.addColorStop(1,'rgba(91,224,208,.22)');x.fillStyle=lg;x.fillRect(sxp-120,CY0-20,124,CY1-CY0+40);x.fillStyle='rgba(91,224,208,.8)';x.fillRect(sxp,CY0-20,2,CY1-CY0+40)}
  // arêtes
  D.E.forEach((e,i)=>{const r=ERANK[i];if(r>=shown)return;const A=NP[e[0]],B=NP[e[1]];const fresh=cl(1-(shown-r)/18);
    x.strokeStyle=fresh>0?`rgba(91,224,208,${.35+.6*fresh})`:'rgba(150,170,230,.30)';x.lineWidth=1.4+fresh*2;x.beginPath();x.moveTo(A.x,A.y);x.quadraticCurveTo((A.x+B.x)/2+(B.y-A.y)*.12,(A.y+B.y)/2-(B.x-A.x)*.12,B.x,B.y);x.stroke()});
  // arêtes mises en lumière
  if(hiEdges)hiEdges.forEach(([i,col,k])=>{if(k<=0)return;const e=D.E[i],A=NP[e[0]],B=NP[e[1]];x.save();x.globalAlpha=alpha*k;x.strokeStyle=col;x.lineWidth=3.2;x.shadowColor=col;x.shadowBlur=16;x.beginPath();x.moveTo(A.x,A.y);x.quadraticCurveTo((A.x+B.x)/2+(B.y-A.y)*.12,(A.y+B.y)/2-(B.x-A.x)*.12,B.x,B.y);x.stroke();x.restore()});
  // points
  const used=new Set();D.E.forEach((e,i)=>{if(ERANK[i]<shown){used.add(e[0]);used.add(e[1])}});
  NP.forEach((p,i)=>{if(!used.has(i))return;const tw=.55+.45*Math.sin(t*2.3+i*1.7);x.beginPath();x.arc(p.x,p.y,7+tw*3,0,7);x.fillStyle=`rgba(120,190,255,${.06+.06*tw})`;x.fill();x.beginPath();x.arc(p.x,p.y,3+tw*1.4,0,7);x.fillStyle=`rgba(230,235,255,${.5+.45*tw})`;x.fill()});
  x.restore()}
function axes(a){if(a<=0)return;T('HISTOIRE  →',CX1,CY1+26,15,{al:'right',c:INK2,ls:3,w:800,a});x.save();x.translate(CX0-26,CY0+40);x.rotate(-Math.PI/2);T('FORCE  →',0,0,15,{al:'right',c:INK2,ls:3,w:800,a});x.restore()}

// --- pluie de combats simulés
const ND=500,nA=Math.round(FIN[0]*ND),nD=Math.round(FIN[1]*ND);
const DOTS=(()=>{const r=rng(7);const lab=[];for(let i=0;i<ND;i++)lab.push(i<nA?0:i<nA+nD?1:2);for(let i=ND-1;i>0;i--){const j=Math.floor(r()*(i+1));[lab[i],lab[j]]=[lab[j],lab[i]]}
  const cnt=[0,0,0];return lab.map((b,i)=>({b,k:cnt[b]++,t0:42.5+i*.0092,jx:(r()-.5)*420}))})();

const CHAIN={M:[150,300],O:[420,300],Kk:[660,300],I:[930,300]};
const SHAKES=[2.55,19.55,33.55,47.6];
function shakeAt(t){let dx=0,dy=0,fl=0;SHAKES.forEach(s=>{const u=t-s;if(u>=0&&u<.45){const k=1-u/.45;dx+=Math.sin(u*90)*15*k;dy+=Math.cos(u*70)*10*k;fl=Math.max(fl,k*.3)}});return [dx,dy,fl]}
const pctS=v=>Math.round(v*100)+' %';
const fmt=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');

function renderAt(t){
  x.setTransform(1,0,0,1,0,0);
  const g=x.createRadialGradient(W/2,H*.42,40,W/2,H*.42,H*.95);g.addColorStop(0,'#141826');g.addColorStop(1,BG);x.fillStyle=g;x.fillRect(0,0,W,H);
  const [sx,sy,fl]=shakeAt(t);x.translate(sx,sy);

  // ---------- constellation (fond vivant de tout le film)
  const draw=t<4?.18+.05*Math.sin(t):eio(seg(t,4.4,8.2))*.82+.18;
  const cA=t<4?.28:t<9.4?lerp(.28,1,eo(seg(t,4,4.7))):t<42?lerp(1,.16,eio(seg(t,9.4,10.4))):t<50?lerp(.16,.06,seg(t,42,43)):lerp(.06,0,seg(t,50,51));
  const hi=[];
  if(t>11&&t<28.6){const k=win(t,11.2,28.6,.4,.6);hi.push([D.key.MO,GOLD,k*(1+.0)]);}
  if(t>14.6&&t<28.6)hi.push([D.key.OK,INK,win(t,14.8,28.6,.4,.6)]);
  if(t>18.6&&t<28.6)hi.push([D.key.IK,RED,win(t,18.8,28.6,.4,.6)]);
  // scintillement des chaînes Minato → Itachi
  let pathK=0;if(t>21.2&&t<23.6){pathK=win(t,21.2,23.6,.2,.4);const i0=Math.floor((t-21.2)*40);for(let j=0;j<10;j++){const p=D.paths[(i0+j*7)%D.paths.length];p.forEach(ei=>hi.push([ei,CYAN,pathK*.85]))}}
  const cBoost=pathK>0?lerp(cA,.55,pathK):cA;
  constellation(t,cBoost,draw,hi);
  axes(win(t,5,9.6,.5,.4));

  // en-tête
  T('THE REAL ODDS',40,62,22,{al:'left',c:INK2,ls:5,w:800});
  rr(W-170,34,130,40,20);x.fillStyle='rgba(29,32,41,.9)';x.fill();T('NARUTO',W-105,61,18,{c:INK2,ls:3,w:800});
  const caps=[[4.2,9.8,'LE MODÈLE : TOUS LES COMBATS DU MANGA'],[10,23.4,'1 · QUI A BATTU QUI'],[23.4,28.6,'2 · OUI, MAIS QUAND ?'],[28.6,42,'3 · LE VRAI CLASH'],[42,50,'4 · LE VERDICT'],[50,56,'RESPECT À ITACHI']];
  caps.forEach(([a,b,s])=>{const k=win(t,a,b,.3,.25);T(s,W/2,132+(1-k)*14,29,{a:k,ls:3,c:INK,w:900})});

  // ---------- 0-4 s : accroche
  if(t<4.6){const a1=win(t,0,3.0,.25,.5);T("LES FANS D'ITACHI,",W/2,380-eo(seg(t,0,.5))*20,74,{a:a1,w:900});
    const k=seg(t,1.0,1.35),sc=lerp(1.9,1,back(k));x.save();x.translate(W/2,520);x.scale(sc,sc);T('ASSEYEZ-VOUS.',0,0,112,{a:k*win(t,1,3.0,.01,.5),c:GOLD,w:900,glow:30});x.restore();}

  // ---------- personnages : entrée, plongée dans la constellation, puis chaîne
  const enter=eo(seg(t,2.4,3.0));
  const toStar=eio(seg(t,4.0,4.9)),fromStar=eio(seg(t,9.2,10.2));
  const mStar=NP[D.mi],iStar=NP[D.ii];
  let mx=lerp(-200,300,enter),ix=lerp(W+200,780,enter),my=480,iy=480,nr=118;
  mx=lerp(mx,mStar.x,toStar);my=lerp(my,mStar.y,toStar);ix=lerp(ix,iStar.x,toStar);iy=lerp(iy,iStar.y,toStar);nr=lerp(nr,26,toStar);
  mx=lerp(mx,CHAIN.M[0],fromStar);my=lerp(my,CHAIN.M[1],fromStar);ix=lerp(ix,CHAIN.I[0],fromStar);iy=lerp(iy,CHAIN.I[1],fromStar);nr=lerp(nr,62,fromStar);
  const s4=eio(seg(t,28.6,30)),s4out=eio(seg(t,41,42.2));
  const mX=lerp(mx,300,s4*(1-s4out)),mY=lerp(my,430,s4*(1-s4out)),mR=lerp(nr,96,s4*(1-s4out));
  const iA=1-s4*(1-s4out),vHide=1-win(t,42,50.2,.4,.01);
  if(t>2.4&&t<4.6){const k=win(t,2.5,4.1,.15,.3);x.save();x.translate(W/2,480);const s=lerp(1.6,1,back(seg(t,2.5,2.8)));x.scale(s,s);T('VS',0,0,96,{a:k,c:INK,w:900,bl:'middle'});x.restore()}
  const mGlow=(t>33.4&&t<42?.6+.4*Math.sin(t*5):0)+(t>4.9&&t<9.4?.5+.5*Math.sin(t*6):0);
  const iGlow=t>4.9&&t<9.4?.5+.5*Math.sin(t*6+1):0;
  if(t<50.2){node(mX,mY,mR,GOLD,toStar>.5&&fromStar<.5?'':'Minato','M','minato',vHide,mGlow);node(ix,iy,nr,RED,toStar>.5&&fromStar<.5?'':'Itachi','I','itachi',iA*vHide,iGlow)}
  // étiquettes dans la constellation
  const lab=win(t,5.2,9.2,.4,.3);T('MINATO · nuit de Kyûbi',mStar.x-36,mStar.y+6,19,{al:'right',c:GOLD,w:800,a:lab});T('ITACHI · partie 1',iStar.x+36,iStar.y+6,19,{al:'left',c:RED,w:800,a:lab});

  // ---------- 4-10 s : compteurs et fil des combats
  if(t>4.2&&t<10){const a=win(t,4.3,9.9,.3,.4);const u=eio(seg(t,4.4,8.2));
    const nShown=Math.floor(u*D.E.length);const idx=D.order[Math.max(0,Math.min(D.E.length-1,nShown-1))];
    rr(70,170,940,46,12);x.save();x.globalAlpha=a*.92;x.fillStyle='rgba(12,14,20,.85)';x.fill();x.restore();
    T('●',94,201,14,{c:CYAN,a:a*(.5+.5*Math.sin(t*20)),al:'left'});T(D.tick[idx]||'',116,201,19,{al:'left',c:INK,w:600,a});
    const items=[[D.nf,'COMBATS'],[D.nc,'PERSONNAGES'],[D.narcs,'ARCS'],[D.nst+D.nor,'PREUVES OFFICIELLES']];
    items.forEach(([n,l],i)=>{const cx=150+i*260,k=eo(seg(t,4.6+i*.35,6.8+i*.35));T(fmt(n*k),cx,890,54,{w:900,a,c:i===3?GOLD:INK});T(l,cx,926,16,{c:INK2,ls:3,w:800,a})});
  }

  // étiquettes d'a priori
  const tagA=win(t,10.2,11.4,.3,.4);
  T('départ : 4e Hokage',CHAIN.M[0]-60,442,19,{a:tagA,c:GOLD,w:700,al:'left'});T('départ : rang S',CHAIN.I[0]+60,442,19,{a:tagA,c:RED,w:700,al:'right'});

  // ---------- 10-28 s : la chaîne
  const chainA=1-seg(t,28.4,29.4);
  if(t>10&&t<29.5){
    const oPop=back(seg(t,10.3,10.75)),kPop=back(seg(t,14,14.45));const thin=eio(seg(t,24.6,26.4));
    arrow(CHAIN.M[0]+66,300,CHAIN.O[0]-62,300,eo(seg(t,10.9,12.2)),GOLD,lerp(9,3,thin),{a:chainA*lerp(1,.5,thin),flow:t});
    arrow(CHAIN.O[0]+62,300,CHAIN.Kk[0]-62,300,eo(seg(t,14.6,15.6)),GREY,6,{dash:true,head:false,a:chainA});
    if(t>15.4)T('=',540,288,52,{a:chainA*seg(t,15.4,15.8),c:INK,w:900,bl:'middle'});
    arrow(CHAIN.I[0]-66,300,CHAIN.Kk[0]+62,300,eo(seg(t,18.3,19.5)),RED,lerp(9,3,thin),{a:chainA*lerp(1,.5,thin),flow:t});
    if(oPop>0){x.save();x.translate(CHAIN.O[0],300);x.scale(oPop,oPop);node(0,0,56,GREY,'Obito','O','obito',chainA);x.restore()}
    if(kPop>0){x.save();x.translate(CHAIN.Kk[0],300);x.scale(kPop,kPop);node(0,0,56,GREY,'Kakashi','K','kakashi',chainA);x.restore()}
    const cardsA=chainA*(1-seg(t,23.4,24));
    card(285,412,236,'NUIT DE KYÛBI','Minato bat Obito',GOLD,cardsA*eo(seg(t,11.6,12.3)));
    card(540,412,236,'DIMENSION KAMUI','Égalité',GREY,cardsA*eo(seg(t,15.2,15.9)));
    card(795,412,236,'TSUKUYOMI','Itachi plie Kakashi',RED,cardsA*eo(seg(t,19.2,19.9)));
    // les 350 chaînes
    if(pathK>0){const n=Math.round(D.npaths*eo(seg(t,21.3,22.6)));T('+ '+n+' CHAÎNES DE COMBATS',W/2,190,34,{c:CYAN,w:900,a:pathK,glow:20});T('relient Minato à Itachi dans le manga',W/2,226,20,{c:INK,w:700,a:pathK})}
    // frise du temps
    if(t>23.4){const a=win(t,23.6,28.6,.4,.5);const X0=110,X1=970,Y=590,tl=v=>X0+(v+5)/(18+5)*(X1-X0);
      x.save();x.globalAlpha=a;x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=3;x.beginPath();x.moveTo(X0,Y);x.lineTo(X1,Y);x.stroke();x.restore();
      [[-4,'3e guerre'],[0,'Kyûbi'],[12.6,'Partie 1'],[17,'4e guerre']].forEach(([v,s])=>{T(s,tl(v),Y+34,16,{c:INK2,w:700,a});x.save();x.globalAlpha=a;x.fillStyle='rgba(255,255,255,.4)';x.fillRect(tl(v)-1,Y-6,2,12);x.restore()});
      const ev=[[0,GOLD,'Minato bat Obito','Obito a 15 ans',24.0],[12.9,RED,'Itachi plie Kakashi','Kakashi jeune',24.5],[17,GREY,'Obito = Kakashi','des années après',25.0]];
      ev.forEach(([v,col,s,sub,t0],j)=>{const k=back(seg(t,t0,t0+.4));if(k<=0)return;const px=tl(v),py=Y-60-(j===1?0:0);
