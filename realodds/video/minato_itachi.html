<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minato vs Itachi · animation</title>
<style>
html,body{margin:0;background:#0b0c10;color:#f2f2ee;font-family:'Inter',system-ui,sans-serif}
canvas{display:block;width:100%;max-width:1080px;margin:0 auto;aspect-ratio:1080/960}
#ui{max-width:1080px;margin:10px auto;display:flex;gap:12px;align-items:center;padding:0 16px;box-sizing:border-box}
#ui button{font:600 15px inherit;background:#1d2029;color:#f2f2ee;border:1px solid #333743;border-radius:8px;padding:8px 14px;cursor:pointer}
#ui input{flex:1;accent-color:#F5C542}

</style></head><body>
<canvas id="c" width="1080" height="960"></canvas>
<div id="ui"><button id="pp">▶ Lecture</button><input type="range" id="sc" min="0" max="60" step="0.01" value="0"><span id="tt">0.0 s</span></div>
<script>
// Animation pilotée par le temps : renderAt(t) dessine l'image exacte à t secondes (sert au rendu vidéo image par image).
const W=1080,H=960,K=1.6,C1=0.352,DUR=60;
const GOLD='#F5C542',RED='#E5384F',GREY='#8A8D96',STEEL='#7FA7D9',INK='#F2F2EE',INK2='#A9ABB3',AMBER='#FF9F43',BG='#0B0C10';
const F="'Inter Display','Inter',system-ui,sans-serif";
const cv=document.getElementById('c'),x=cv.getContext('2d');
const cl=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const eo=t=>1-Math.pow(1-cl(t),3),eio=t=>{t=cl(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
const back=t=>{t=cl(t);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));
const win=(t,a,b,fi=.35,fo=.35)=>Math.min(seg(t,a,a+fi),1-seg(t,b-fo,b));

// --- probabilités : même calcul que le modèle (écart de force × échelle, seuils ordinaux)
function odds(a,sa,b,sb){const mu=(a-b)*K,s=Math.hypot(sa,sb)*K;let pa=0,pb=0,ws=0;
  for(let i=0;i<=600;i++){const z=-9+18*i/600,w=Math.exp(-.5*((z-mu)/s)**2);ws+=w;pa+=w*(1-1/(1+Math.exp(-(C1-z))));pb+=w/(1+Math.exp(C1+z))}
  return [pa/ws,1-(pa+pb)/ws,pb/ws]}
// Ce que le modèle croit à chaque étape [t, Minato moyenne, écart-type, Itachi moyenne, écart-type]
// Départ = titres officiels ; arrivée = valeurs du modèle ajusté (Minato 5,84 ± 0,64 ; Itachi Edo 5,67 ± 0,38)
const KF=[[0,6.0,.5,5.5,.6],[12.6,6.0,.5,5.5,.6],[13.8,6.05,.47,5.5,.6],[19.6,6.05,.47,5.5,.6],[21,6.05,.47,5.85,.45],[24.8,6.05,.47,5.85,.45],[26.8,5.7,.6,5.75,.42],[34.4,5.7,.6,5.75,.42],[36.6,5.84,.635,5.671,.378]];
function belief(t){let i=0;while(i<KF.length-1&&t>KF[i+1][0])i++;const a=KF[i],b=KF[Math.min(i+1,KF.length-1)];
  if(a===b||t<=a[0])return a.slice(1);const u=eio((t-a[0])/(b[0]-a[0]));return a.slice(1).map((v,j)=>lerp(v,b[j+1],u))}

// --- outils de dessin
function T(s,px,py,size,{w=800,c=INK,al='center',a=1,ls=0,bl='alphabetic'}={}){if(a<=0)return;x.save();x.globalAlpha*=a;x.font=`${w} ${size}px ${F}`;x.fillStyle=c;x.textAlign=al;x.textBaseline=bl;x.letterSpacing=ls+'px';x.fillText(s,px,py);x.restore()}
function tw(s,size,w=800,ls=0){x.save();x.font=`${w} ${size}px ${F}`;x.letterSpacing=ls+'px';const m=x.measureText(s).width;x.restore();return m}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r)}
function node(px,py,r,col,name,ini,a=1,glow=0){if(a<=0)return;x.save();x.globalAlpha*=a;
  if(glow>0){x.shadowColor=col;x.shadowBlur=60*glow}
  const g=x.createRadialGradient(px,py-r*.4,r*.1,px,py,r);g.addColorStop(0,'#2a2d38');g.addColorStop(1,'#14161d');
  x.beginPath();x.arc(px,py,r,0,7);x.fillStyle=g;x.fill();x.shadowBlur=0;x.lineWidth=Math.max(3,r*.07);x.strokeStyle=col;x.stroke();
  const img=IMG[ini];if(img&&img.complete&&img.naturalWidth){x.save();x.beginPath();x.arc(px,py,r-x.lineWidth/2,0,7);x.clip();const s=Math.max(2*r/img.naturalWidth,2*r/img.naturalHeight);x.drawImage(img,px-img.naturalWidth*s/2,py-img.naturalHeight*s/2,img.naturalWidth*s,img.naturalHeight*s);x.restore()}
  else T(ini,px,py+r*.02,r*.8,{c:col,bl:'middle',w:900});
  if(name)T(name.toUpperCase(),px,py+r+34,Math.max(20,r*.36),{c:INK,ls:2});x.restore()}
function arrow(x1,y1,x2,y2,p,col,lw,{dash=false,head=true,a=1}={}){if(p<=0||a<=0)return;const ex=lerp(x1,x2,p),ey=lerp(y1,y2,p);x.save();x.globalAlpha*=a;x.strokeStyle=col;x.fillStyle=col;x.lineWidth=lw;x.lineCap='round';
  if(dash)x.setLineDash([lw*1.6,lw*2.2]);x.beginPath();x.moveTo(x1,y1);x.lineTo(ex,ey);x.stroke();x.setLineDash([]);
  if(head&&p>.15){const an=Math.atan2(y2-y1,x2-x1),hs=lw*3.4;x.beginPath();x.moveTo(ex,ey);x.lineTo(ex-hs*Math.cos(an-.45),ey-hs*Math.sin(an-.45));x.lineTo(ex-hs*Math.cos(an+.45),ey-hs*Math.sin(an+.45));x.closePath();x.fill()}x.restore()}
function card(cx,cy,w,kick,title,col,a,chip,chipA=0){if(a<=0)return;const h=chip&&chipA>0?118+28*chipA:104;x.save();x.globalAlpha*=a;const yy=cy+(1-a)*20;
  rr(cx-w/2,yy,w,h,16);x.fillStyle='rgba(22,24,31,.92)';x.fill();x.lineWidth=2;x.strokeStyle=col;x.globalAlpha*=.9;x.stroke();x.globalAlpha/=.9;
  T(kick,cx,yy+34,17,{c:col,ls:2.5,w:800});T(title,cx,yy+76,27,{w:800});
  if(chip&&chipA>0)T(chip,cx,yy+112,19,{c:AMBER,w:700,a:chipA});x.restore()}

// --- images des personnages (facultatif) : ?a=minato.png&b=itachi.png
const IMG={};const qs=new URLSearchParams(location.search);[['M','a'],['I','b']].forEach(([k,p])=>{if(qs.get(p)){const im=new Image();im.src=qs.get(p);IMG[k]=im}});

// --- pluie de 400 combats simulés (proportions finales : 48 / 14 / 38 sur 100)
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const FIN=odds(5.84,.635,5.671,.378);const ND=400;const nA=Math.round(FIN[0]*ND),nD=Math.round(FIN[1]*ND);
const DOTS=(()=>{const r=rng(7);const lab=[];for(let i=0;i<ND;i++)lab.push(i<nA?0:i<nA+nD?1:2);for(let i=ND-1;i>0;i--){const j=Math.floor(r()*(i+1));[lab[i],lab[j]]=[lab[j],lab[i]]}
  const cnt=[0,0,0];return lab.map((b,i)=>({b,k:cnt[b]++,t0:42.6+i*.011,jx:(r()-.5)*260}))})();

const CHAIN={M:[150,300],O:[420,300],Kk:[660,300],I:[930,300]};
const SHAKES=[2.55,19.55,33.55];
function shakeAt(t){let dx=0,dy=0,fl=0;SHAKES.forEach(s=>{const u=t-s;if(u>=0&&u<.45){const k=1-u/.45;dx+=Math.sin(u*90)*16*k;dy+=Math.cos(u*70)*11*k;fl=Math.max(fl,k*.35)}});return [dx,dy,fl]}
const pctS=v=>Math.round(v*100)+' %';

function renderAt(t){
  x.setTransform(1,0,0,1,0,0);
  // fond
  const g=x.createRadialGradient(W/2,H*.45,60,W/2,H*.45,H*.9);g.addColorStop(0,'#161924');g.addColorStop(1,BG);x.fillStyle=g;x.fillRect(0,0,W,H);
  x.save();x.globalAlpha=.05;x.strokeStyle='#ffffff';x.lineWidth=1;const off=(t*24)%60;for(let i=-H;i<W+H;i+=60){x.beginPath();x.moveTo(i+off,0);x.lineTo(i+off-H*.6,H);x.stroke()}x.restore();
  const [sx,sy,fl]=shakeAt(t);x.translate(sx,sy);
  // en-tête
  T('THE REAL ODDS',40,62,22,{al:'left',c:INK2,ls:5,w:800});
  rr(W-170,34,130,40,20);x.fillStyle='#1d2029';x.fill();T('NARUTO',W-105,61,18,{c:INK2,ls:3,w:800});
  const caps=[[4.2,10,'1 · CE QUE DISENT LES TITRES'],[10,23.4,'2 · QUI A BATTU QUI'],[23.4,28.6,'3 · OUI, MAIS QUAND ?'],[28.6,42,'4 · LE VRAI CLASH'],[42,50,'5 · LE VERDICT'],[50,56,'RESPECT À ITACHI']];
  caps.forEach(([a,b,s])=>{const k=win(t,a,b,.3,.25);T(s,W/2,132+(1-k)*14,30,{a:k,ls:3,c:INK,w:900})});

  // ---- scène 1 : l'accroche
  if(t<4.6){const a1=win(t,0,3.0,.25,.5);T("LES FANS D'ITACHI,",W/2,380-eo(seg(t,0,.5))*20,74,{a:a1,w:900});
    const k=seg(t,1.0,1.35),sc=lerp(1.9,1,back(k));x.save();x.translate(W/2,520);x.scale(sc,sc);T('ASSEYEZ-VOUS.',0,0,112,{a:k*win(t,1,3.0,.01,.5),c:GOLD,w:900});x.restore();}
  // personnages : entrée puis place dans la chaîne
  const enter=eo(seg(t,2.4,3.0)),toChain=eio(seg(t,3.6,4.8));
  const mx=lerp(lerp(-200,300,enter),CHAIN.M[0],toChain),my=lerp(470,CHAIN.M[1],toChain),ix=lerp(lerp(W+200,780,enter),CHAIN.I[0],toChain),iy=my,nr=lerp(118,62,toChain);
  // scène 4 : Minato au centre, Itachi s'efface ; verdict : retour
  const s4=eio(seg(t,28.6,30)),s4out=eio(seg(t,41,42.4));
  const mX=lerp(mx,300,s4*(1-s4out)),mY=lerp(my,430,s4*(1-s4out)),mR=lerp(nr,96,s4*(1-s4out));
  const iA=1-s4*(1-s4out);const vHide=1-win(t,42,50.2,.4,.01);
  if(t>2.4&&t<4.6){const k=win(t,2.5,4.3,.15,.4);x.save();x.translate(W/2,480);x.scale(lerp(1.6,1,back(seg(t,2.5,2.8))),lerp(1.6,1,back(seg(t,2.5,2.8))));T('VS',0,0,96,{a:k,c:INK,w:900,bl:'middle'});x.restore()}
  const restA=t<42?1:1-seg(t,42,42.6)*.0;
  const mGlow=t>33.4&&t<42?.6+.4*Math.sin(t*5):0;
  if(t<50.2){const fade=1-seg(t,49.6,50.2);
    node(mX,mY,mR,GOLD,'Minato','M',fade*vHide,mGlow);
    node(ix,iy,nr,RED,'Itachi','I',fade*iA*vHide);}
  // étiquettes d'a priori
  const tagA=win(t,4.8,10.4,.4,.4);
  T('4e Hokage · Éclair jaune',CHAIN.M[0]+10,442,21,{a:tagA,c:GOLD,w:700,al:'left'});T('Rang S · Akatsuki',CHAIN.I[0]-10,442,21,{a:tagA,c:RED,w:700,al:'right'});
  // ---- scène 2-3 : la chaîne
  const chainA=1-seg(t,28.4,29.4);
  if(t>10&&t<29.5){
    const oPop=back(seg(t,10.3,10.75)),kPop=back(seg(t,14,14.45));
    const thin=eio(seg(t,24.6,26.4));
    arrow(CHAIN.M[0]+66,300,CHAIN.O[0]-62,300,eo(seg(t,10.9,12.2)),GOLD,lerp(9,3,thin),{a:chainA*lerp(1,.5,thin)});
    arrow(CHAIN.O[0]+62,300,CHAIN.Kk[0]-62,300,eo(seg(t,14.6,15.6)),GREY,6,{dash:true,head:false,a:chainA});
    if(t>15.4)T('=',540,286,52,{a:chainA*seg(t,15.4,15.8),c:INK,w:900,bl:'middle'});
    arrow(CHAIN.I[0]-66,300,CHAIN.Kk[0]+62,300,eo(seg(t,18.3,19.5)),RED,lerp(9,3,thin),{a:chainA*lerp(1,.5,thin)});
    if(oPop>0){x.save();x.translate(CHAIN.O[0],300);x.scale(oPop,oPop);node(0,0,56,GREY,'Obito','O',chainA);x.restore()}
    if(kPop>0){x.save();x.translate(CHAIN.Kk[0],300);x.scale(kPop,kPop);node(0,0,56,GREY,'Kakashi','K',chainA);x.restore()}
    const chip=seg(t,23.8,24.4);
    card(285,412,236,'NUIT DE KYÛBI','Minato bat Obito',GOLD,chainA*eo(seg(t,11.6,12.3)),'mais Obito a 15 ans',chip);
    card(540,412,236,'DIMENSION KAMUI','Égalité',GREY,chainA*eo(seg(t,15.2,15.9)));
    card(795,412,236,'TSUKUYOMI','Itachi plie Kakashi',RED,chainA*eo(seg(t,19.2,19.9)),'Kakashi jeune, partie 1',seg(t,24.6,25.2));
    if(t>25.2&&t<28.6)T('→ deux victoires qui pèsent peu',W/2,180,26,{a:win(t,25.4,28.6,.3,.3),c:AMBER,w:800});
  }
  // ---- scène 4 : Raikage + Killer B
  if(t>29.4&&t<42.6){const a=win(t,29.6,42.4,.4,.5);
    const p1=back(seg(t,30.2,30.7)),p2=back(seg(t,30.7,31.2));
    T('3E GRANDE GUERRE NINJA',W/2,196,22,{a:a*seg(t,29.8,30.3),c:INK2,ls:4,w:800});
    const ln=(bx,by)=>{const an=Math.atan2(by-430,bx-300);arrow(300+100*Math.cos(an),430+100*Math.sin(an),bx-72*Math.cos(an),by-72*Math.sin(an),eo(seg(t,32.4,33.5)),GOLD,7,{dash:true,head:false,a})};ln(760,310);ln(800,540);
    if(p1>0){x.save();x.translate(760,310);x.scale(p1,p1);node(0,0,66,STEEL,'Raikage','A',a);x.restore()}
    if(p2>0){x.save();x.translate(800,540);x.scale(p2,p2);node(0,0,66,STEEL,'Killer B','B',a);x.restore()}
    const k=seg(t,33.5,33.85);x.save();x.translate(W/2,716);x.scale(lerp(1.7,1,back(k)),lerp(1.7,1,back(k)));T('TIENT TÊTE AUX DEUX',0,0,64,{a:a*k,c:GOLD,w:900});x.restore();
    T('Seul. En même temps.',W/2,770,28,{a:a*seg(t,35,35.5),c:INK,w:700});
  }
  // ---- courbes de croyance (scènes 2 à 4)
  const curA=Math.min(seg(t,5,6.2),1-seg(t,41.6,42.4))*(t>28.6&&t<41.6?0:1)+(t>28.6&&t<41.6?0:0);
  const curB=t>=28.6&&t<42?0:curA;
  const [mA,sA,mI,sI]=belief(t);
  function curves(alpha,yBase,hMax,y0){if(alpha<=0)return;const X0=90,X1=990,lo=3.8,hi=7.8,xs=v=>X0+(v-lo)*(X1-X0)/(hi-lo);
    x.save();x.globalAlpha*=alpha;x.strokeStyle='rgba(255,255,255,.14)';x.lineWidth=2;x.beginPath();x.moveTo(X0,yBase);x.lineTo(X1,yBase);x.stroke();
    for(let v=4;v<=7.5;v+=1){T(String(v),xs(v),yBase+28,16,{c:INK2,w:600})}
    T('FORCE ESTIMÉE (échelons)',X1,yBase+28,15,{al:'right',c:INK2,ls:1.5,w:700,a:.8});
    const grow=eo(seg(t,5.2,6.6));
    [[mA,sA,GOLD],[mI,sI,RED]].forEach(([m,s,c])=>{const pk=hMax*.378/s*grow;x.beginPath();for(let i=0;i<=180;i++){const v=lo+(hi-lo)*i/180,y=yBase-pk*Math.exp(-.5*((v-m)/s)**2);i?x.lineTo(xs(v),y):x.moveTo(xs(v),y)}
      x.lineWidth=4;x.strokeStyle=c;x.stroke();x.lineTo(xs(hi),yBase);x.lineTo(xs(lo),yBase);x.closePath();x.globalAlpha*=.18;x.fillStyle=c;x.fill();x.globalAlpha/=.18;
      const right=c===GOLD?mA>=mI:mI>mA;T(m.toFixed(1),xs(m)+(right?12:-12),yBase-pk-12,22,{c,w:800,a:grow,al:right?'left':'right'})});x.restore()}
  curves(curB,770,200);
  // ---- scène 5 : verdict, 400 combats simulés
  if(t>42&&t<50.4){const a=win(t,42.2,50.3,.3,.4);const bx=[270,540,810],cols=[GOLD,GREY,RED],base=700,cs=16,gap=15;
    T('400 COMBATS SIMULÉS',W/2,196,22,{a,c:INK2,ls:4,w:800});
    x.save();x.globalAlpha*=a;
    DOTS.forEach(d=>{const u=seg(t,d.t0,d.t0+.55);if(u<=0)return;const col=d.k%cs,row=Math.floor(d.k/cs);const tx=bx[d.b]+(col-(cs-1)/2)*gap,ty=base-row*gap;
      const px=lerp(W/2+d.jx,tx,eio(u)),py=lerp(160,ty,u*u);x.beginPath();x.arc(px,py,5.6,0,7);x.fillStyle=cols[d.b];x.fill()});x.restore();
    const cnt=[0,0,0];DOTS.forEach(d=>{if(t>=d.t0+.55)cnt[d.b]++});
    ['MINATO','NUL','ITACHI'].forEach((s,i)=>{T(s,bx[i],748,22,{a,c:cols[i],ls:3,w:900});const tot=i===0?nA:i===1?nD:ND-nA-nD;T(Math.round(FIN[i]*100*cnt[i]/tot)+' %',bx[i],base-Math.ceil(tot/cs)*gap-26,46,{a:a*seg(t,42.8,43.2),c:INK,w:900})});
    const k=seg(t,47.6,48);x.save();x.translate(W/2,262);x.scale(lerp(1.6,1,back(k)),lerp(1.6,1,back(k)));T('MINATO PASSE DEVANT',0,0,62,{a:a*k,c:GOLD,w:900});x.restore();
  }
  // ---- scène 6 : respect
  if(t>50&&t<56.3){const a=win(t,50.1,56.2,.4,.4),p=eo(seg(t,50.6,52.6))*.74;
    x.save();x.globalAlpha*=a;x.lineWidth=30;x.lineCap='round';x.strokeStyle='rgba(255,255,255,.08)';x.beginPath();x.arc(W/2,440,190,0,7);x.stroke();
    x.strokeStyle=RED;x.shadowColor=RED;x.shadowBlur=30;x.beginPath();x.arc(W/2,440,190,-Math.PI/2,-Math.PI/2+p*2*Math.PI);x.stroke();x.restore();
    T(Math.round(p*100)+' %',W/2,462,104,{a,c:INK,w:900});T('DU CASTING BATTU',W/2,512,22,{a,c:INK2,ls:3,w:800});
    T('Surcoté ? Jamais.',W/2,712,46,{a:a*seg(t,53,53.5),c:RED,w:900});}
  // ---- scène 7 : appel aux commentaires
  if(t>55.8){const a=seg(t,55.9,56.4),pulse=1+.04*Math.sin(t*7);x.save();x.translate(W/2,380);x.scale(pulse,pulse);T('ET TOI ?',0,0,150,{a,c:GOLD,w:900});x.restore();
    T('Ton argument en commentaire',W/2,500,44,{a:seg(t,56.5,57),w:800});T('↓',W/2,590+Math.sin(t*6)*10,70,{a:seg(t,56.8,57.2),c:GOLD,w:900});
    T('S’il tient, je corrige le modèle.',W/2,700,28,{a:seg(t,57.5,58),c:INK2,w:700});}
  // ---- barre de probabilités (persistante)
  const bA=seg(t,6.3,7.0);
  if(bA>0&&t<56){x.save();x.globalAlpha*=bA*(1-seg(t,55.4,56));const [pa,pd,pb]=t>=42?FIN:odds(mA,sA,mI,sI);const X0=40,Wb=W-80,Y=850,Hb=34;
    rr(X0,Y,Wb,Hb,10);x.fillStyle='#1d2029';x.fill();
    const g1=Wb*pa,g2=Wb*pd;x.save();rr(X0,Y,Wb,Hb,10);x.clip();x.fillStyle=GOLD;x.fillRect(X0,Y,g1-2,Hb);x.fillStyle='#4a4d57';x.fillRect(X0+g1+2,Y,g2-4,Hb);x.fillStyle=RED;x.fillRect(X0+g1+g2+2,Y,Wb-g1-g2-2,Hb);x.restore();
    T('MINATO',X0,836,20,{al:'left',c:GOLD,ls:3,w:900});T('ITACHI',X0+Wb,836,20,{al:'right',c:RED,ls:3,w:900});
    T(pctS(pa),X0,930,44,{al:'left',w:900});T(pctS(pb),X0+Wb,930,44,{al:'right',w:900});T('nul '+pctS(pd),X0+g1+g2/2,922,20,{c:INK2,w:700});
    const tight=win(t,26.8,32,.3,.5);if(tight>0)T('SERRÉ',W/2,836,20,{c:AMBER,ls:4,w:900,a:tight});
    x.restore()}
  // flash
  if(fl>0){x.setTransform(1,0,0,1,0,0);x.fillStyle=`rgba(255,255,255,${fl})`;x.fillRect(0,0,W,H)}
}
window.renderAt=renderAt;
// lecture
let playing=false,t0=0,tcur=0;const pp=document.getElementById('pp'),sc=document.getElementById('sc'),tt=document.getElementById('tt');
function frame(now){if(!playing)return;tcur=(now-t0)/1000;if(tcur>=DUR){tcur=DUR;playing=false;pp.textContent='▶ Lecture'}sc.value=tcur;tt.textContent=tcur.toFixed(1)+' s';renderAt(tcur);if(playing)requestAnimationFrame(frame)}
pp.onclick=()=>{if(playing){playing=false;pp.textContent='▶ Lecture';return}if(tcur>=DUR)tcur=0;playing=true;pp.textContent='❚❚ Pause';t0=performance.now()-tcur*1000;requestAnimationFrame(frame)};
sc.oninput=()=>{tcur=+sc.value;tt.textContent=tcur.toFixed(1)+' s';if(playing)t0=performance.now()-tcur*1000;renderAt(tcur)};
if(qs.has('film'))document.body.classList.add('film');
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>renderAt(qs.has('t')?+qs.get('t'):0));
</script></body></html>
